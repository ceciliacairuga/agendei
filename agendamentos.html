<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Meus Agendamentos — agendei!</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="views/assets/_common/styles/variables.css" />
  <link rel="stylesheet" href="views/assets/app/styles/app-layout.css" />
  <link rel="stylesheet" href="views/assets/app/styles/agendamentos.css" />
  <link rel="stylesheet" href="views/assets/app/styles/novo-agendamento.css" />
</head>
<body class="app-body">

  <aside class="sidebar" id="sidebar" aria-label="Menu do aplicativo">
    <header class="sidebar-header">
      <p class="sidebar-logo">agendei<span class="logo-accent">!</span></p>
      <button class="sidebar-close" id="sidebar-close" aria-label="Fechar menu">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </header>
    <nav class="sidebar-nav" aria-label="Navegação principal">
      <ul role="list">
        <li><a href="dashboard.html" class="nav-item">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
          Painel
        </a></li>
        <li><a href="agendamentos.html" class="nav-item nav-item--active" aria-current="page">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
          Agendamentos
        </a></li>
        <li><a href="catalogo-servicos.html" class="nav-item">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
          Serviços
        </a></li>
        <li><a href="perfil.html" class="nav-item">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          Meu Perfil
        </a></li>
      </ul>
    </nav>
    <footer class="sidebar-footer">
      <article class="user-chip">
        <figure class="user-avatar" aria-hidden="true">CC</figure>
        <section>
          <p class="user-name-text">Cristiane Cairuga</p>
          <p class="user-role-text">Cliente</p>
        </section>
      </article>
      <a href="/agendei/views/assets/public/login.html" class="logout-btn" aria-label="Sair">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16,17 21,12 16,7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      </a>
    </footer>
  </aside>

  <figure class="sidebar-overlay" id="sidebar-overlay" aria-hidden="true"></figure>

  <section class="app-content">
    <header class="topbar">
      <button class="topbar-hamburger" id="sidebar-toggle" aria-label="Abrir menu" aria-expanded="false" aria-controls="sidebar">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <p class="topbar-page-title">Agendamentos</p>
    </header>

    <main class="page-body" id="main-content">
      <header class="page-heading page-heading--flex">
        <section>
          <h1 class="page-title">Meus Agendamentos</h1>
          <p class="page-subtitle">Gerencie todos os seus horários em um só lugar</p>
        </section>
        <button class="btn btn--primary" id="new-appt-btn" aria-label="Criar novo agendamento">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          Novo agendamento
        </button>
      </header>

      <!-- Filtros -->
      <section class="filter-bar" aria-label="Filtros de agendamento">
        <ul class="filter-tabs" role="list" id="filter-tabs">
          <li><button class="filter-tab filter-tab--active" data-filter="todos" aria-pressed="true">Todos</button></li>
          <li><button class="filter-tab" data-filter="confirmado" aria-pressed="false">Confirmados</button></li>
          <li><button class="filter-tab" data-filter="pendente" aria-pressed="false">Pendentes</button></li>
          <li><button class="filter-tab" data-filter="concluido" aria-pressed="false">Concluídos</button></li>
          <li><button class="filter-tab" data-filter="cancelado" aria-pressed="false">Cancelados</button></li>
        </ul>
      </section>

      <!-- Lista de agendamentos -->
      <section class="appt-cards" id="appt-list" aria-label="Lista de agendamentos">

         <!-- Os cartões serão criados pelo JavaScript -->

      </section>

      <!-- Estado vazio (oculto por padrão) -->
      <article class="empty-state" id="empty-state" hidden aria-live="polite">
        <figure class="empty-icon" aria-hidden="true">📅</figure>
        <h3 class="empty-title">Nenhum agendamento encontrado</h3>
        <p class="empty-desc">Você ainda não tem agendamentos nesta categoria.</p>
        <a class="btn btn--primary" href="novo-agendamento.html">Fazer primeiro agendamento</a>
      </article>

    </main>
  </section>

  <script type="module" src="views/assets/app/scripts/app-guard.js"></script>
  <script type="module" src="views/assets/app/scripts/agendamentos.js"></script>
  <script defer src="views/assets/_common/scripts/sidebar.js"></script>
</body>
</html>
